name: Daily health check

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Serialize manual and scheduled runs so issue lookup/create cannot race.
concurrency:
  group: puzzleme-health-check
  cancel-in-progress: false

jobs:
  checks:
    name: Health checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
    outputs:
      install: ${{ steps.install.outcome }}
      typecheck: ${{ steps.typecheck.outcome }}
      test: ${{ steps.test.outcome }}
      build: ${{ steps.build.outcome }}
      audit: ${{ steps.audit.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        id: install
        continue-on-error: true
        run: node .github/scripts/health-check.mjs install
      - name: TypeScript
        id: typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: node .github/scripts/health-check.mjs typecheck
      - name: Unit tests
        id: test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: node .github/scripts/health-check.mjs test
      - name: Production Web build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: node .github/scripts/health-check.mjs build
      - name: Audit all locked dependencies (all severities)
        id: audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: node .github/scripts/health-check.mjs audit
      - name: Upload safe diagnostic logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: health-diagnostics
          path: artifacts/health/*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Fail if any required check did not succeed
        if: ${{ !cancelled() }}
        env:
          RESULTS: ${{ toJSON(steps) }}
        run: |
          node --input-type=module <<'NODE'
          const results = JSON.parse(process.env.RESULTS);
          const checks = ['install', 'typecheck', 'test', 'build', 'audit'];
          if (checks.some(name => results[name]?.outcome !== 'success')) process.exit(1);
          NODE

  report:
    name: Report health failures
    needs: checks
    if: ${{ !cancelled() && needs.checks.result == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    # No checkout, dependency install, artifact execution, or production secrets.
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CHECK_RESULTS: ${{ toJSON(needs.checks.outputs) }}
        with:
          script: |
            const results = JSON.parse(process.env.CHECK_RESULTS);
            const labels = ['bug', 'automated'];
            const names = {
              install: 'Dependency installation', typecheck: 'TypeScript',
              test: 'Unit tests', build: 'Production Web build', audit: 'Dependency audit',
            };
            const failed = Object.keys(names).filter(key => results[key] === 'failure');
            // Setup, runner, timeout, and artifact failures may have no failed check output.
            if (failed.length === 0) failed.push('infrastructure');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', per_page: 100,
            });
            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({ ...context.repo, name: label });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  ...context.repo, name: label, color: label === 'bug' ? 'd73a4a' : '5319e7',
                });
              }
            }
            for (const key of failed) {
              const marker = `<!-- puzzleme-health:${key}:v1 -->`;
              if (openIssues.some(issue => !issue.pull_request && issue.body?.includes(marker))) {
                core.info(`Existing open issue covers ${key}; no duplicate created.`);
                continue;
              }
              const title = `[Health check] ${names[key] ?? 'Workflow infrastructure'} failed`;
              const body = [
                marker, `## Failure summary`, title,
                `Run: ${runUrl}`, `Commit: ${context.sha}`,
                'Review the failed job and the health-diagnostics artifact for exit codes and allowlisted diagnostics.',
                'Raw command output is intentionally excluded to prevent accidental credential disclosure.',
                '## Reproduction',
                '1. Check out the run commit and use the Node/pnpm versions pinned in the repository.',
                '2. Run the corresponding command documented in docs/continuous-development.md.',
                '## Acceptance criteria',
                '- [ ] Identify the cause and propose a reviewed fix.',
                '- [ ] Re-run the failed check and the complete CI workflow successfully.',
                '- [ ] Record Web/iOS checks actually performed and remaining limitations.',
                'No automated implementation or merging is authorized by this issue.',
              ].join('\n\n');
              const { data: issue } = await github.rest.issues.create({ ...context.repo, title, body, labels });
              openIssues.push(issue);
              core.info(`Created issue #${issue.number} for ${key}.`);
            }
